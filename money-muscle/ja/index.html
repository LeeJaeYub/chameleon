<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHAMELEONZ — ゲーム感覚で学ぶ株式・お金の勉強</title>
<meta name="description" content="1日数分で鍛えるお金の筋肉。株式・財務諸表・投資心理まで9レベル80レッスン。アカウント登録なしですぐ始められます。">
<meta name="theme-color" content="#ddd6c8">

<!-- カスタムドメインを使うときは chameleoon.pages.dev だけ書き換えれば大丈夫です。
     新しい言語版が増えるたびに hreflang を1行ずつ追加してください。 -->
<link rel="canonical" href="https://chameleoon.pages.dev/ja/">
<link rel="alternate" hreflang="ko" href="https://chameleoon.pages.dev/">
<link rel="alternate" hreflang="en" href="https://chameleoon.pages.dev/en/">
<link rel="alternate" hreflang="ja" href="https://chameleoon.pages.dev/ja/">
<link rel="alternate" hreflang="zh" href="https://chameleoon.pages.dev/zh/">
<link rel="alternate" hreflang="x-default" href="https://chameleoon.pages.dev/">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">

<!-- JSを実行しない検索・AIクローラーにも何のアプリか伝わるようテキストで明示します -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "CHAMELEONZ (マネーマッスル)",
  "url": "https://chameleoon.pages.dev/ja/",
  "description": "1日数分、ゲーム感覚で学べるお金・投資の学習アプリ。無料・アカウント登録不要。",
  "applicationCategory": "EducationApplication",
  "operatingSystem": "Any (Webブラウザ)",
  "inLanguage": "ja",
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Course",
  "name": "マネーマッスル 金融リテラシー・カリキュラム",
  "description": "お金の基礎から株式、財務諸表、マクロ経済、リスク管理、投資家心理まで — 9レベル80レッスン。",
  "provider": { "@type": "Organization", "name": "CHAMELEONZ" },
  "inLanguage": "ja",
  "isAccessibleForFree": true,
  "hasCourseInstance": {
    "@type": "CourseInstance",
    "courseMode": "online",
    "courseWorkload": "PT3M"
  },
  "hasPart": [
    { "@type": "Course", "name": "レベル1 · お金ってなに?", "description": "株より先に、お金そのものの感覚をつかみます。予算・貯金・複利がなぜそう動くのか分かるようになります。" },
    { "@type": "Course", "name": "レベル2 · 初めての株", "description": "株とは何か、売買するとはどういうことかを学びます。板を初めて開いても戸惑わなくなります。" },
    { "@type": "Course", "name": "レベル3 · 数字を読み解く", "description": "PERや配当利回りのような数字を読み解けるようになります。銘柄情報の画面がもう暗号に見えません。" },
    { "@type": "Course", "name": "レベル4 · 相場を読む", "description": "金利・物価・失業率 — ニュースに毎日出てくる言葉を株価と結びつけて理解します。" },
    { "@type": "Course", "name": "レベル5 · 会社を読む", "description": "「財務諸表」という言葉から逃げなくなります。表を3つ読めれば会社の状態が見えてきます。" },
    { "@type": "Course", "name": "レベル6 · 一点集中はNG", "description": "一つの銘柄に集中するのがなぜ危険か、手数料やレバレッジのような見えにくいリスクは何かを学びます。" },
    { "@type": "Course", "name": "レベル7 · 株だけじゃない", "description": "株以外にもお金を増やす方法はたくさんあります。それぞれが何かを正確に押さえます — どの商品も勧めません。" },
    { "@type": "Course", "name": "レベル8 · お金の管理術", "description": "投資の前に整えておきたい生活の中のお金の話です。信用スコア・ローン・保険・税金を一気に整理します。" },
    { "@type": "Course", "name": "レベル9 · 投資家の心理学", "description": "数字を知っていても、人は合理的には動きません。最後のレベルはその落とし穴を見抜く練習です。" }
  ]
}
</script>
</head>
<body>

<main class="app">

  <!-- ══ 01 온보딩 · 학습 이유 ══ -->
  <section class="screen" id="s-why">
    <div class="ob-top">
      <span class="ob-back" aria-hidden="true">&nbsp;</span>
      <div class="ob-track"><div class="ob-fill" style="width:33%"></div></div>
    </div>
    <div class="ob-body">
      <div class="sticker-row">
        <div class="sticker is-idle" style="width:130px;height:130px;border-radius:24px" data-leon="idle"></div>
        <p class="bubble" data-t="why.bubble"></p>
      </div>
      <h1 class="ob-q" data-t="why.q"></h1>
      <div class="opts" id="why-opts"></div>
      <div style="height:8px"></div>
    </div>
    <div class="foot">
      <button class="btn btn-primary" id="why-next" data-t="cta.continue" disabled></button>
    </div>
  </section>

  <!-- ══ 01 온보딩 · 일일 목표 ══ -->
  <section class="screen" id="s-goal" hidden>
    <div class="ob-top">
      <button class="ob-back" id="goal-back" data-t-aria="goal.back">&lsaquo;</button>
      <div class="ob-track"><div class="ob-fill" style="width:66%"></div></div>
    </div>
    <div class="ob-body">
      <div class="sticker-row">
        <div class="sticker is-idle" style="width:130px;height:130px;border-radius:24px;animation-delay:.4s" data-leon="idle"></div>
        <p class="bubble" data-t="goal.bubble"></p>
      </div>
      <h1 class="ob-q" data-t="goal.q"></h1>
      <div class="opts" id="goal-opts"></div>
      <div class="forecast">
        <span class="forecast-chip" data-t="goal.chip"></span>
        <p class="forecast-text" id="goal-forecast" data-t="goal.hint"></p>
      </div>
      <div style="height:8px"></div>
    </div>
    <div class="foot">
      <button class="btn btn-primary" id="goal-next" data-t="cta.continue" disabled></button>
    </div>
  </section>

  <!-- ══ 01 온보딩 · 코스 짓는 중 ══ -->
  <section class="screen" id="s-build" hidden>
    <div class="building">
      <div class="orbit">
        <span class="orbit-coin" style="width:26px;height:26px;background:#ffb020"></span>
        <span class="orbit-coin" style="width:18px;height:18px;background:#dff7ee;animation-delay:1.7s"></span>
        <div class="sticker is-build" style="width:180px;height:180px;border-radius:34px;border-width:6px" data-leon="correct"></div>
      </div>
      <p class="build-title" data-t="build.title"></p>
      <div class="build-track"><div class="build-fill"></div></div>
      <p class="build-note" id="build-note"></p>
    </div>
  </section>

  <!-- ══ 02 홈 · 학습 경로 ══ -->
  <section class="screen" id="s-home" hidden>
    <button class="level-head" id="home-level-tab">
      <span class="level-head-main">
        <!-- 첫 그림은 syncHeader()가 채웁니다 — 미리 적어두면 다른 언어판에서 한글이 깜빡여요 -->
        <span class="level-tag" id="home-level-tag"></span>
        <span class="level-name" id="home-level-name"></span>
      </span>
      <span class="level-count" id="home-count">0 / 8</span>
      <span class="level-more" aria-hidden="true">&rsaquo;</span>
    </button>
    <div class="path" id="path"></div>
    <div class="scroll-rail" id="scroll-rail" aria-hidden="true">
      <svg viewBox="0 0 6 1000" preserveAspectRatio="none">
        <path class="scroll-rail-track" d="M3,0 L3,1000"/>
        <path class="scroll-rail-fill" id="scroll-rail-fill" d="M3,0 L3,1000"/>
      </svg>
      <div class="scroll-rail-dot" id="scroll-rail-dot"></div>
    </div>
  </section>

  <!-- ══ 03 투자 · 모의 포트폴리오 ══ -->
  <section class="screen" id="s-invest" hidden>
    <div class="inv-top">
      <div class="inv-label" data-t="invest.label"></div>
      <div class="inv-total" id="inv-total">$0</div>
    </div>
    <div class="inv-body">
      <div class="sticker-row">
        <div class="sticker is-idle" style="width:114px;height:114px;border-radius:22px" data-leon="idle"></div>
        <p class="bubble" data-t="invest.bubble"></p>
      </div>
      <p class="inv-note" data-t="invest.note"></p>
    </div>
  </section>

  <!-- ══ 02b 커리큘럼 전체 ══ -->
  <section class="screen" id="s-curriculum" hidden>
    <div class="cur-top">
      <div>
        <div class="cur-title" data-t="cur.title"></div>
        <div class="cur-sub" id="cur-sub"></div>
      </div>
      <button class="cur-close" id="cur-close" data-t-aria="cur.close"><span></span><span></span></button>
    </div>
    <div class="cur-body" id="cur-body"></div>
  </section>

  <!-- ══ 02 레슨 ══ -->
  <section class="screen" id="s-lesson" hidden>
    <div class="phase">
      <div class="phase-left" id="phase-left"></div>
      <span class="combo" id="combo"></span>
    </div>
    <div class="lesson-top">
      <button class="lesson-close" id="lesson-close" data-t-aria="lesson.close">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="bar" id="bar"></div>
    </div>
    <div class="lesson-body" id="lesson-body"></div>
    <div class="lesson-foot" id="lesson-foot">
      <button class="btn btn-primary" id="lesson-cta" data-t="cta.check" disabled></button>
    </div>
  </section>

  <!-- ══ 03 레슨 완료 ══ -->
  <section class="screen" id="s-done" hidden>
    <div class="center-screen">
      <div class="orbit" style="width:210px;height:210px">
        <span class="spark" style="left:22px;top:6px;width:11px;height:11px;background:#ffb020"></span>
        <span class="spark" style="left:80px;top:0;width:9px;height:9px;background:#00b37e;animation-delay:.4s"></span>
        <span class="spark" style="left:134px;top:8px;width:11px;height:11px;background:#ffb020;animation-delay:.75s"></span>
        <div class="sticker is-correct" style="width:190px;height:190px;border-radius:34px;border-width:6px" data-leon="correct"></div>
      </div>
      <div class="done-head">
        <div class="done-label" id="done-label" hidden></div>
        <h1 class="done-title" id="done-title" data-t="done.title"></h1>
      </div>
      <div class="score-row">
        <div class="score on-xp">
          <div class="score-head" id="done-xp-head" data-t="done.xpHead"></div>
          <div class="score-value" id="done-xp">0</div>
        </div>
        <div class="score on-acc">
          <div class="score-head" id="done-acc-head" data-t="done.accHead"></div>
          <div class="score-value" id="done-acc">0%</div>
        </div>
      </div>
    </div>
    <div class="foot">
      <button class="btn btn-primary" id="done-next" data-t="cta.continue"></button>
    </div>
  </section>

  <div class="toast" id="toast" aria-live="polite"></div>

  <!-- ══ 03 가입 요청 ══ -->
  <section class="screen" id="s-signup" hidden>
    <div class="center-screen" style="gap:26px">
      <div class="sticker is-idle" style="width:230px;height:230px;border-radius:32px;border-width:6px" data-leon="idle"></div>
      <h1 class="done-title" style="font-size:28px" data-t="signup.title"></h1>
      <div class="recap">
        <div class="recap-row">
          <span class="recap-label" data-t="signup.units"></span>
          <span class="recap-value" id="recap-units"></span>
        </div>
        <div class="rule"></div>
        <div class="recap-row">
          <span class="recap-label" data-t="signup.money"></span>
          <span class="recap-value" id="recap-xp">0</span>
        </div>
      </div>
    </div>
    <div class="signup-foot">
      <button class="btn btn-cobalt" id="signup-yes" data-t="signup.yes"></button>
      <button class="btn btn-ghost" id="signup-later" data-t="signup.later"></button>
    </div>
  </section>

  <!-- 하단 탭 — 화면 바깥에 두고, 탭이 있는 화면에서만 보입니다 -->
  <nav class="tabbar" id="tabbar" hidden>
    <button class="tab is-active" data-goes="s-home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V9.5L12 4l8 5.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="tab-label" data-t="tab.learn"></span>
    </button>
    <button class="tab" data-goes="s-invest">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19h16M5 15l4-5 4 3 6-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="tab-label" data-t="tab.invest"></span>
    </button>
    <!-- 언어 — 화면을 옮기는 탭이 아니라 목록을 여는 버튼이라, 선 하나로 갈라둡니다.
         고를 언어가 하나뿐이면 i18n.js가 이 버튼을 켜지 않습니다. -->
    <button class="tab tab-lang" id="tab-lang" data-t-aria="lang.pick" hidden>
      <span class="flag"></span>
      <span class="tab-label"></span>
    </button>
  </nav>

</main>

<script src="../i18n.js"></script>
<script src="ui.js"></script>
<script src="content.js"></script>
<script src="../app.js"></script>
</body>
</html>

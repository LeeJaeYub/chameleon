<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHAMELEONZ</title>
<meta name="description" content="하루 몇 분으로 쌓는 돈 근육. 계정 없이 바로 시작하세요.">
<meta name="theme-color" content="#ddd6c8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="app">

  <!-- ══ 01 온보딩 · 학습 이유 ══ -->
  <section class="screen" id="s-why">
    <div class="ob-top">
      <span class="ob-back" aria-hidden="true">&nbsp;</span>
      <div class="ob-track"><div class="ob-fill" style="width:33%"></div></div>
    </div>
    <div class="ob-body">
      <div class="sticker-row">
        <div class="sticker is-idle" style="width:88px;height:88px;border-radius:24px" data-leon="idle"></div>
        <p class="bubble">반가워요. 몇 가지만 물어볼게요.</p>
      </div>
      <h1 class="ob-q">왜 돈 공부를<br>시작하시나요?</h1>
      <div class="opts" id="why-opts"></div>
      <div style="height:8px"></div>
    </div>
    <div class="foot">
      <button class="btn btn-primary" id="why-next" disabled>계속하기</button>
    </div>
  </section>

  <!-- ══ 01 온보딩 · 일일 목표 ══ -->
  <section class="screen" id="s-goal" hidden>
    <div class="ob-top">
      <button class="ob-back" id="goal-back" aria-label="이전으로">&lsaquo;</button>
      <div class="ob-track"><div class="ob-fill" style="width:66%"></div></div>
    </div>
    <div class="ob-body">
      <div class="sticker-row">
        <div class="sticker is-idle" style="width:88px;height:88px;border-radius:24px;animation-delay:.4s" data-leon="idle"></div>
        <p class="bubble">작게 잡아도 괜찮아요.</p>
      </div>
      <h1 class="ob-q">하루 목표를<br>정해볼까요?</h1>
      <div class="opts" id="goal-opts"></div>
      <div class="forecast">
        <span class="forecast-chip">예상 기간</span>
        <p class="forecast-text" id="goal-forecast">목표를 고르면 언제 끝나는지 알려드릴게요.</p>
      </div>
      <div style="height:8px"></div>
    </div>
    <div class="foot">
      <button class="btn btn-primary" id="goal-next" disabled>계속하기</button>
    </div>
  </section>

  <!-- ══ 01 온보딩 · 코스 짓는 중 ══ -->
  <section class="screen" id="s-build" hidden>
    <div class="building">
      <div class="orbit">
        <span class="orbit-coin" style="width:26px;height:26px;background:#ffb020"></span>
        <span class="orbit-coin" style="width:18px;height:18px;background:#dff7ee;animation-delay:1.7s"></span>
        <div class="sticker is-build" style="width:142px;height:142px;border-radius:34px;border-width:6px" data-leon="idle"></div>
      </div>
      <p class="build-title">코스 만드는 중</p>
      <div class="build-track"><div class="build-fill"></div></div>
      <p class="build-note">레벨 1 · 돈의 기초 8유닛</p>
    </div>
  </section>

  <!-- ══ 02 홈 · 학습 경로 ══ -->
  <section class="screen" id="s-home" hidden>
    <button class="level-head" id="home-level-tab">
      <span class="level-head-main">
        <span class="level-tag" id="home-level-tag">레벨 01 · 저축가</span>
        <span class="level-name" id="home-level-name">돈이란 무엇인가</span>
      </span>
      <span class="level-count" id="home-count">0 / 8</span>
      <span class="level-more" aria-hidden="true">&rsaquo;</span>
    </button>
    <div class="path" id="path"></div>
    <div class="scroll-rail" id="scroll-rail" aria-hidden="true">
      <svg viewBox="0 0 6 1000" preserveAspectRatio="none">
        <path class="scroll-rail-track" d="M3,0 L3,1000"/>
        <path class="scroll-rail-fill" id="scroll-rail-fill" d="M3,0 L3,1000"/>
      </svg>
      <div class="scroll-rail-dot" id="scroll-rail-dot"></div>
    </div>
  </section>

  <!-- ══ 03 투자 · 모의 포트폴리오 ══ -->
  <section class="screen" id="s-invest" hidden>
    <div class="inv-top">
      <div class="inv-label">총자산</div>
      <div class="inv-total" id="inv-total">$0</div>
    </div>
    <div class="inv-body">
      <div class="sticker-row">
        <div class="sticker is-idle" style="width:76px;height:76px;border-radius:22px" data-leon="idle"></div>
        <p class="bubble">문제를 풀면 여기에 돈이 쌓여요.</p>
      </div>
      <p class="inv-note">이 돈으로 종목을 사고파는 건 아직 만드는 중이에요.</p>
    </div>
  </section>

  <!-- ══ 02b 커리큘럼 전체 ══ -->
  <section class="screen" id="s-curriculum" hidden>
    <div class="cur-top">
      <div>
        <div class="cur-title">커리큘럼</div>
        <div class="cur-sub">금융 문맹 탈출까지 9레벨</div>
      </div>
      <button class="cur-close" id="cur-close" aria-label="닫기"><span></span><span></span></button>
    </div>
    <div class="cur-body" id="cur-body"></div>
  </section>

  <!-- ══ 02 레슨 ══ -->
  <section class="screen" id="s-lesson" hidden>
    <div class="phase">
      <div class="phase-left" id="phase-left"></div>
      <span class="combo" id="combo"></span>
    </div>
    <div class="lesson-top">
      <button class="lesson-close" id="lesson-close" aria-label="레슨 나가기">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="bar" id="bar"></div>
    </div>
    <div class="lesson-body" id="lesson-body"></div>
    <div class="lesson-foot" id="lesson-foot">
      <button class="btn btn-primary" id="lesson-cta" disabled>확인</button>
    </div>
  </section>

  <!-- ══ 03 레슨 완료 ══ -->
  <section class="screen" id="s-done" hidden>
    <div class="center-screen">
      <div class="orbit" style="width:170px;height:170px">
        <span class="spark" style="left:22px;top:6px;width:11px;height:11px;background:#ffb020"></span>
        <span class="spark" style="left:80px;top:0;width:9px;height:9px;background:#00b37e;animation-delay:.4s"></span>
        <span class="spark" style="left:134px;top:8px;width:11px;height:11px;background:#ffb020;animation-delay:.75s"></span>
        <div class="sticker is-correct" style="width:142px;height:142px;border-radius:34px;border-width:6px" data-leon="correct"></div>
      </div>
      <div class="done-head">
        <div class="done-label" id="done-label" hidden></div>
        <h1 class="done-title" id="done-title">유닛 완료!</h1>
      </div>
      <div class="score-row">
        <div class="score on-xp">
          <div class="score-head" id="done-xp-head">획득 XP</div>
          <div class="score-value" id="done-xp">0</div>
        </div>
        <div class="score on-acc">
          <div class="score-head" id="done-acc-head">잘했어요</div>
          <div class="score-value" id="done-acc">0%</div>
        </div>
      </div>
    </div>
    <div class="foot">
      <button class="btn btn-primary" id="done-next">계속하기</button>
    </div>
  </section>

  <div class="toast" id="toast" aria-live="polite"></div>

  <!-- ══ 03 가입 요청 ══ -->
  <section class="screen" id="s-signup" hidden>
    <div class="center-screen" style="gap:26px">
      <div class="sticker is-idle" style="width:124px;height:124px;border-radius:32px;border-width:6px" data-leon="idle"></div>
      <h1 class="done-title" style="font-size:28px">여기까지 온 기록,<br>저장해둘까요?</h1>
      <div class="recap">
        <div class="recap-row">
          <span class="recap-label">완료한 유닛</span>
          <span class="recap-value" id="recap-units">0개</span>
        </div>
        <div class="rule"></div>
        <div class="recap-row">
          <span class="recap-label">모은 돈</span>
          <span class="recap-value" id="recap-xp">0</span>
        </div>
      </div>
    </div>
    <div class="signup-foot">
      <button class="btn btn-cobalt" id="signup-yes">프로필 만들기</button>
      <button class="btn btn-ghost" id="signup-later">나중에 하기</button>
    </div>
  </section>

  <!-- 하단 탭 — 화면 바깥에 두고, 탭이 있는 화면에서만 보입니다 -->
  <nav class="tabbar" id="tabbar" hidden>
    <button class="tab is-active" data-goes="s-home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V9.5L12 4l8 5.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="tab-label">학습</span>
    </button>
    <button class="tab" data-goes="s-invest">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19h16M5 15l4-5 4 3 6-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="tab-label">투자</span>
    </button>
  </nav>

</main>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
